version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      # SEC-9: credentials from env, not hardcoded
      POSTGRES_USER: ${POSTGRES_USER:-urban_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-urbanflow}
    ports:
      # SEC-3: bind only to loopback — not publicly accessible
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urban_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    # SEC-4: require a password
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    ports:
      # SEC-3: bind only to loopback
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - dashboard_dist:/app/dist:ro
    depends_on:
      - frontend-build
      - api
    restart: always


  # Build the Vite dashboard so nginx has files to serve
  frontend-build:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - dashboard_dist:/app/dist
    command: sh -c "npm install && npm run build"

  api:
    build: .
    command: uvicorn server.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  celery_worker:
    build: .
    command: celery -A server.tasks.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  dashboard_dist:
