events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

    upstream ccc_api {
        server api:8000;
    }

    # SEC-2/5: HTTPS server (production)
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/ssl/certs/urbanflow.crt;
        ssl_certificate_key /etc/ssl/private/urbanflow.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # SEC-13: Security response headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com; connect-src 'self' wss:;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Dashboard (static build)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # API Proxy
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            # SEC-17: prevent oversized payloads from edge devices
            client_max_body_size 512k;
            proxy_pass http://ccc_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect off;
        }

        # MJPEG Stream — no buffering, persistent connection
        location /api/v1/stream/ {
            proxy_pass http://ccc_api;
            proxy_buffering off;
            proxy_ignore_client_abort on;
            proxy_set_header Connection "Keep-Alive";
            proxy_connect_timeout 5s;
            proxy_send_timeout 60m;
            proxy_read_timeout 60m;
        }

        # WebSockets — long-lived upgrade connections
        location /ws/ {
            proxy_pass http://ccc_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }

    # SEC-2/5: Redirect all HTTP → HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }
}
